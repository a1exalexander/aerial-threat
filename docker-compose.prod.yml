# Production-like full stack on one host (doc 08): postgres, one-shot migrate, api, worker, static web.
# The fixed project name (same as `-p aerial-prod`) and the `db` service/volume names keep it away from the dev
# database in docker-compose.yml (container aerial-threat-postgres-1).
#   export GIT_SHA=$(git rev-parse --short HEAD) POSTGRES_PASSWORD=<url-safe secret>
#   docker compose -f docker-compose.prod.yml build && docker compose -f docker-compose.prod.yml up -d
# Server secrets (AI_GATEWAY_API_KEY, TELEGRAM_*, OIDC_*) go in .env.prod (gitignored), never in this file.
# DATABASE_URL, APP_ENV and CORS_ORIGINS are set below and win over .env.prod: this stack always uses its own `db`.
# For managed Postgres, run the same images on the target platform with its own env instead.
name: aerial-prod

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "5" }

x-db-url: &db-url postgres://aerial:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/aerial

x-worker-build: &worker-build
  context: .
  dockerfile: Dockerfile.worker
  args: { GIT_SHA: "${GIT_SHA:-dev}" }

x-app: &app
  env_file: [{ path: .env.prod, required: false }]
  restart: unless-stopped
  logging: *logging
  depends_on:
    migrate: { condition: service_completed_successfully }

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: aerial
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: aerial
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerial -d aerial"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # Applies pending SQL migrations and exits; api/worker start only after it succeeds.
  migrate:
    image: aerial-worker:${GIT_SHA:-dev}
    build: *worker-build
    command: ["node", "db/migrate.js"]
    environment:
      DATABASE_URL: *db-url
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    logging: *logging

  api:
    <<: *app
    image: aerial-api:${GIT_SHA:-dev}
    build:
      context: .
      dockerfile: Dockerfile.api
      args: { GIT_SHA: "${GIT_SHA:-dev}" }
    environment:
      APP_ENV: production
      DATABASE_URL: *db-url
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:5212}
    ports: ["127.0.0.1:${API_HOST_PORT:-3112}:3000"]

  worker:
    <<: *app
    image: aerial-worker:${GIT_SHA:-dev}
    build: *worker-build
    environment:
      APP_ENV: production
      DATABASE_URL: *db-url
    stop_grace_period: 40s # SIGTERM drains in-flight jobs for up to 30 s

  web:
    image: aerial-web:${GIT_SHA:-dev}
    build:
      context: .
      args: { VITE_API_URL: "${PUBLIC_API_URL:-http://localhost:3112}" }
      # Same build stage as the Dockerfiles; the image build fails if a server secret reaches the bundle.
      dockerfile_inline: |
        FROM node:22.23.2-slim AS build
        ENV COREPACK_ENABLE_DOWNLOAD_PROMPT=0 TURBO_TELEMETRY_DISABLED=1 CI=1
        RUN corepack enable
        WORKDIR /repo
        COPY . .
        RUN --mount=type=cache,id=pnpm-store,target=/pnpm-store pnpm install --frozen-lockfile --prefer-offline --store-dir /pnpm-store
        ARG VITE_API_URL
        RUN pnpm turbo run build --filter=@aerial/web && node scripts/check-bundle-secrets.mjs apps/web/dist

        FROM nginx:1.29.8-alpine
        COPY --from=build /repo/apps/web/dist /usr/share/nginx/html
        COPY <<'EOF' /etc/nginx/conf.d/default.conf
        server {
          listen 80;
          root /usr/share/nginx/html;
          location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
          # Unknown paths are client-side routes (react-router): serve the app shell.
          location / { add_header Cache-Control "no-cache"; error_page 404 =200 /index.html; }
        }
        EOF
    ports: ["127.0.0.1:${WEB_HOST_PORT:-5212}:80"]
    restart: unless-stopped
    logging: *logging

volumes:
  dbdata:
