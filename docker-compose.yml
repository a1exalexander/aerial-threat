services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: aerial
      POSTGRES_PASSWORD: aerial
      POSTGRES_DB: aerial
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerial -d aerial"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
